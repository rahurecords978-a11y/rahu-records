<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artist Portal — THE NEW SEASON</title><style>body{background:#090a11;color:white;font:16px/1.6 system-ui;max-width:760px;margin:6vh auto;padding:24px}input,textarea{display:block;width:100%;padding:12px;margin:8px 0 18px;background:#171924;color:white;border:1px solid #666}button{padding:12px 20px;background:#e8c47c;border:0;cursor:pointer}a{color:#e8c47c}.hidden{display:none}</style><a href="index.html">← THE NEW SEASON</a><h1>Artist portal</h1><p>Apply to join the artist roster. Upload access is granted only after administrator approval.</p><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><button id="login">Sign in</button><button id="register">Register</button><div id="application" class="hidden"><h2>Artist application</h2><label>Stage name<input id="stageName" maxlength="100"></label><label>Artist biography<textarea id="bio" maxlength="1500"></textarea></label><button id="apply">Submit application</button></div><div id="upload" class="hidden"><h2>Approved artist uploads</h2><label>Release title<input id="title" maxlength="180"></label><label>Audio file<input id="audio" type="file" accept="audio/*"></label><button id="send">Upload for review</button></div><p id="status" role="status"></p><script type="module" src="artist.js"></script></html>
