name: New Season review checks
on:
  push:
    branches: [the-new-season-review]
  pull_request:
    paths: ['review/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check functions/index.js
          node --check app.js
          node --check artist.js
          node --check demo.js
          node --check studio.js
      - name: Validate JSON configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('functions/package.json','utf8'))"
      - name: Install backend dependencies
        run: npm install --prefix functions --ignore-scripts --no-audit
